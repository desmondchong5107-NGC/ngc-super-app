<script>/* SALES_VENDOR */</script><script>
'use strict';
/* SALES_CONFIG */
// Retire only this module's obsolete Auth namespace before SDK recovery.
for(const legacyKey of ['ngc-sales-auth-v1','ngc-sales-auth-v1-code-verifier','ngc-sales-auth-v1-user']){try{localStorage.removeItem(legacyKey);}catch{}}
const sb=supabase.createClient(SALES_URL,SALES_KEY,{auth:{storageKey:'ngc-sales-auth-v2',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const root=document.getElementById('root'),types=['Cash EQ','EPF','PRS','Cash MM','Others'],transactions=['N. Business','Top Up','Switching'],labels={pending:'Pending',changes_requested:'Changes Requested',approved:'Approved',rejected:'Rejected'};
let user=null,link=null,agent='',cases=[],counts={},view='home',selected=null,draft=null,busy=false,epoch=0,email='',success='',logoutInFlight=false,authBootstrapped=false,loginSending=false,otpVerifying=false,loginEmailSent=false,loginNotice='',loginNoticeKind='';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=x=>'RM '+Number(x||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const chip=s=>`<span class="chip ${esc(s)}">${esc(labels[s]||s)}</span>`;
const date=x=>new Date(x).toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'});
const cashRates=[[0,0],[1.5,.6],[2,.9],[2.5,1.4],[3,1.9],[3.5,2],[4,2.2],[4.5,2.4],[5,2.8],[5.5,3],[6,3],[6.5,3]];
function defaultSC(type){return type==='EPF'?3:type==='PRS'?1.5:type==='Cash EQ'?3:0;}
function defaultPS(type,sc){return type==='EPF'?2.2:type==='PRS'?.9:type==='Cash EQ'?(cashRates.find(([charge])=>charge===Number(sc))?.[1]??0):0;}
function fixedRates(type){return ['EPF','PRS','Cash MM'].includes(type);}
function validCashRates(i){return cashRates.some(([sc,ps])=>number(i.sales_charge)===sc&&number(i.ps_rate)===ps);}
function rateControls(i,n){const cash=i.product_type==='Cash EQ',valid=validCashRates(i),fixed=fixedRates(i.product_type);
 const sc=cash?`<select id="sc-${n}" data-item="${n}" data-field="sales_charge" required>${!valid?'<option value="" disabled selected>Choose a valid rate</option>':''}${cashRates.map(([v])=>`<option value="${v}" ${valid&&number(i.sales_charge)===v?'selected':''}>${v===0?'0':v.toFixed(1)}%</option>`).join('')}</select>`:`<input id="sc-${n}" type="number" data-item="${n}" data-field="sales_charge" value="${esc(i.sales_charge)}" ${fixed?'readonly':''} min="0" max="6.5" step="any" inputmode="decimal" required>`;
 return `<div class="grid"><div><label for="sc-${n}">Sales Charge %</label>${sc}</div><div><label for="ps-${n}">PS Rate %</label><input id="ps-${n}" type="number" data-item="${n}" data-field="ps_rate" value="${esc(i.ps_rate)}" ${cash||fixed?'readonly':''} min="0" max="100" step="any" inputmode="decimal" required></div></div>${cash&&!valid?`<p class="notice warning" role="status">Saved rates preserved: Sales Charge ${esc(i.sales_charge)}%, PS ${esc(i.ps_rate)}%. Select a valid Cash EQ Sales Charge to confirm the matching PS Rate${draft.attempt?'; this saved attempt is locked. Check My Submissions before discarding it and preparing a corrected draft':''}.</p>`:''}`;
}
function updateItemControl(target){const n=Number(target.dataset.item),item=draft.items[n],field=target.dataset.field;
 if(field==='ps_rate'&&(fixedRates(item.product_type)||item.product_type==='Cash EQ'))return;
 if(field==='sales_charge'&&fixedRates(item.product_type))return;
 item[field]=target.value;
 if(field==='gross_investment')syncSingleInvestment();
 if(field==='product_type'){item.sales_charge=String(defaultSC(item.product_type));item.ps_rate=String(defaultPS(item.product_type,item.sales_charge));}
 else if(field==='sales_charge'&&item.product_type==='Cash EQ'){item.ps_rate=String(defaultPS(item.product_type,item.sales_charge));}
 if(field==='product_type'||(field==='sales_charge'&&item.product_type==='Cash EQ'))document.getElementById('rates-'+n).innerHTML=rateControls(item,n);
}
const blankItem=()=>({product_name:'',product_type:'Cash EQ',gross_investment:'',sales_charge:'3',ps_rate:'1.9'});
const newDraft=()=>({investment_mode:'single',record_date:new Date().toLocaleDateString('en-CA'),client_name:'',transaction_type:'N. Business',remark:'',total_investment:'',items:[blankItem()],attempt:null});
function inferInvestmentMode(d){
 if(d.items.length!==1||d.investment_mode==='multiple')return'multiple';
 const total=d.total_investment,gross=d.items[0].gross_investment;
 return String(total)===String(gross)||(Number.isFinite(number(total))&&number(total)===number(gross))?'single':'multiple';
}
function restoreInvestmentMode(d){d.investment_mode=inferInvestmentMode(d);return d;}
function syncSingleInvestment(){if(draft?.investment_mode==='single'&&draft.items.length===1&&!draft.attempt)draft.total_investment=draft.items[0].gross_investment;}
function switchInvestmentMode(mode){
 if(!draft||busy||draft.attempt||!['single','multiple'].includes(mode))return;
 if(mode==='single'&&draft.items.length>1){message('Remove the additional funds before switching to Single Fund.','warning');return;}
 if(mode===draft.investment_mode)return;
 draft.investment_mode=mode;draft.total_investment=draft.items[0].gross_investment;save();renderForm();
}
const key=()=>`ngc-sales-draft-v1:${user.id}`;
function save(){if(!user||!draft)return;try{localStorage.setItem(key(),JSON.stringify({saved_at:Date.now(),draft}));}catch{message('This device could not save the draft. Keep this screen open.','warning');}}
function loadDraft(){try{const x=JSON.parse(localStorage.getItem(key()));if(x&&Date.now()-x.saved_at<7*86400000&&Array.isArray(x.draft?.items))return restoreInvestmentMode(x.draft);localStorage.removeItem(key());}catch{}return null;}
function message(text,kind='error'){const el=document.getElementById('message');if(el){el.className='notice '+kind;el.textContent=text;}}
function safeError(error){const s=error?.message||'';if(/mapping/i.test(s))return'Your Sales account is not active. Contact the administrator.';if(/revision|Pending submission|Changes requested/i.test(s))return'This case has changed. Refresh its details before editing again.';if(/different content/i.test(s))return'This attempt already has different saved content. Check My Submissions before starting another case.';if(/JWT|token|Authentication/i.test(s))return'Your Sales session needs to be renewed. Please sign in again.';if(/rate|security purposes|seconds/i.test(s))return'Please wait a moment before requesting another email.';return'Could not reach Sales. Your draft is saved on this device and has not been confirmed as submitted. Retry with the same saved attempt.';}
const check=async p=>{const r=await p;if(r.error)throw r.error;return r.data;};
function header(back=true){return`<div class="bar">${back?'<button data-action="home">‹ Sales Home</button>':'<span class="muted">NGC · Sales</span>'}<button data-action="signout" ${logoutInFlight?'disabled':''}>${logoutInFlight?'Signing out…':'Sign out'}</button></div><div id="message" role="status"></div>${!navigator.onLine?'<div class="notice warning">Offline · drafts stay on this device. Sales needs a connection.</div>':''}`;}
function render(){
 if(!authBootstrapped){root.innerHTML='<div class="center" role="status"><h1>NGC Sales</h1><p>Loading Sales…</p></div>';return;}
 if(!user){root.innerHTML=`<div class="center"><img src="icon-commission.svg" alt=""><h1>NGC Sales</h1><p class="muted">Submit sales for administrator verification.</p></div><div id="message" role="status" class="notice ${esc(loginNoticeKind)}" ${loginNotice?'':'hidden'}>${esc(loginNotice)}</div><form id="login"><label for="email">Your email</label><input id="email" type="email" autocomplete="email" required value="${esc(email)}"><button class="primary full" ${loginSending?'disabled':''}>${loginSending?'Sending…':'Send login code'}</button><p class="muted">Use your registered Sales email. Other Super App tools remain available without signing in.</p></form><form id="otp" ${loginEmailSent?'':'hidden'}><label for="code">Email verification code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" type="text" pattern="[0-9]{8}" minlength="8" maxlength="8" enterkeyhint="done" aria-describedby="otp-help" required><button class="primary full" ${otpVerifying?'disabled':''}>${otpVerifying?'Verifying…':'Verify code'}</button><p id="otp-help" class="muted">Return to NGC Super App after checking your email and enter the 8-digit code here.</p></form>`;return;}
 if(!link){root.innerHTML=header(false)+`<div class="center"><h1>Account Pending Activation</h1><p>Your NGC Sales account has not been activated yet. Please contact the administrator.</p><p class="muted">${esc(user.email)}</p><button data-action="refresh">Check activation</button></div>`;return;}
 if(view==='form'){renderForm();return;}
 if(view==='detail'){renderDetail();return;}
 root.innerHTML=header(false)+`<p class="workspace-label">Your sales workspace</p><h1 class="agent-name">${esc(agent)}</h1>${success?`<p class="success">${esc(success)}</p>`:''}<button class="primary full" data-action="new">+ Submit Sales</button>${loadDraft()?'<button class="full" data-action="resume">Resume draft · Not submitted</button>':''}<div class="counts">${Object.keys(labels).map(s=>`<div class="count ${esc(s)}"><span class="muted">${labels[s]}</span><strong>${counts[s]??'—'}</strong></div>`).join('')}</div><div class="row"><h2>My Submissions</h2><button data-action="refresh">Refresh</button></div>${cases.length?cases.map(s=>`<button class="case" data-case="${esc(s.id)}"><div class="row"><strong>${esc(s.client_name||'Client reference')}</strong>${chip(s.status)}</div><div class="row"><span>${money(s.total_investment)}</span><span class="muted">${s.sales_submission_items?.length||0} fund${s.sales_submission_items?.length===1?'':'s'}</span></div><small class="muted">Transaction ${esc(s.record_date)} · Submitted ${date(s.submitted_at)}</small></button>`).join(''):'<div class="card"><p>No submissions yet.</p><p class="muted">Only sales submitted successfully appear here. Device drafts stay separate.</p></div>'}<p class="muted">Showing your most recent ${cases.length} submissions (up to 100).</p>`;
}
async function refresh(){if(logoutInFlight)return;const turn=++epoch;busy=true;try{const session=await check(sb.auth.getSession());if(turn!==epoch||logoutInFlight)return;const u=session.session?.user;if(!u){busy=false;user=null;link=null;render();return;}user=u;
 const links=await check(sb.from('agent_user_links').select('agent_id,active').eq('user_id',u.id).eq('active',true).limit(1));if(turn!==epoch)return;link=links[0]||null;if(!link){render();return;}
 const names=await check(sb.from('agents').select('name').eq('id',link.agent_id).limit(1));agent=names[0]?.name||'Your NGC account';
 const list=await check(sb.from('sales_submissions').select('id,record_date,client_name,total_investment,status,submitted_at,sales_submission_items(id)').eq('submitter_user_id',u.id).order('submitted_at',{ascending:false}).limit(100));
 const totals=await Promise.all(Object.keys(labels).map(async status=>{const r=await sb.from('sales_submissions').select('id',{count:'exact',head:true}).eq('submitter_user_id',u.id).eq('status',status);if(r.error)throw r.error;return[status,r.count];}));
 if(turn!==epoch)return;cases=list;counts=Object.fromEntries(totals);render();
 }catch(e){if(turn!==epoch)return;if(!authBootstrapped){loginNotice=safeError(e);loginNoticeKind='error';return;}const saved=user&&loadDraft();if(saved){busy=false;draft=saved;view='form';agent=agent||'Your NGC account';renderForm();message('Sales is unavailable. Saved on this device · Not submitted.','warning');return;}if(!root.querySelector('#message'))root.innerHTML=header(false)+'<h1>Sales unavailable</h1><p>Your form is kept on this device. No submission is recorded without confirmation.</p><button data-action="refresh">Retry connection</button>';message(safeError(e));}finally{busy=false;}}
function number(v){return v!==''&&Number.isFinite(Number(v))?Number(v):NaN;}
function totals(){let allocated=0,net=0,commission=0;for(const i of draft.items){const gross=number(i.gross_investment),sc=number(i.sales_charge),ps=number(i.ps_rate);allocated+=Math.round((gross||0)*100);const n=gross/(1+(sc/100)*(1+.08));net+=n||0;commission+=(n*(ps/100))||0;}return{allocated:allocated/100,net,commission};}
function validation(){if(!draft)return'No draft';if(!Array.isArray(draft.items)||draft.items.length<1||draft.items.length>100)return'Add between 1 and 100 fund items.';if(!/^\d{4}-\d{2}-\d{2}$/.test(draft.record_date)||draft.record_date<'1900-01-01'||draft.record_date>'2200-12-31'||(!Number.isFinite(Date.parse(draft.record_date))||new Date(draft.record_date).toISOString().slice(0,10)!==draft.record_date))return'Choose a valid transaction date.';if(!draft.client_name.trim()||draft.client_name.length>200)return'Enter a client name/reference (up to 200 characters).';if(draft.remark.length>2000)return'Keep the remark within 2,000 characters.';const total=number(draft.total_investment);if(!(total>0&&total<=1e12)||Math.abs(total*100-Math.round(total*100))>0.0001)return draft.investment_mode==='single'?'Enter gross investment with up to two decimal places.':'Enter total investment with up to two decimal places.';for(const i of draft.items){if(!i.product_name.trim()||i.product_name.length>200)return'Enter a product/fund name for every item.';const g=number(i.gross_investment),sc=number(i.sales_charge),ps=number(i.ps_rate);if(!(g>0&&g<=1e12)||Math.abs(g*100-Math.round(g*100))>0.0001)return'Every fund needs a positive gross amount with up to two decimal places.';if(!(sc>=0&&sc<=6.5))return'Sales charge must be between 0% and 6.5%.';if(i.product_type==='Cash EQ'&&!validCashRates(i))return'Select a valid Cash EQ Sales Charge to confirm its matching PS Rate. Saved draft rates have not been changed.';if(!(ps>=0&&ps<=100))return'PS rate must be between 0% and 100%.';if(fixedRates(i.product_type)&&(sc!==defaultSC(i.product_type)||ps!==defaultPS(i.product_type,sc)))return'Use the fixed sales charge and PS rate for '+i.product_type+'. Reselect Product Type to apply them.';if(!types.includes(i.product_type))return'Choose a valid product type.';}if(!transactions.includes(draft.transaction_type))return'Choose a transaction type.';if(Math.round(total*100)!==Math.round(totals().allocated*100))return'Fund allocations must equal Total Investment.';return'';}
function options(arr,v){return arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');}
function field(name,label,type='text',extra=''){return`<label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(draft[name])}" ${extra}>`;}
function renderForm(){restoreInvestmentMode(draft);const frozen=!!draft.attempt,single=draft.investment_mode==='single';
 root.innerHTML=header()+`<h1>${draft.edit_id?'Update submission':'Submit Sales'}</h1><p class="muted">${esc(agent)} · ${link?'Your identity is linked to your account.':'Reconnect to verify your Sales account.'}</p>${draft.edit_id?`<div class="notice warning review-reason"><strong>Changes requested</strong><p>${esc(draft.reason)}</p></div>`:''}<p id="draftState" class="notice">Saved on this device · Not submitted</p><form id="sale"><fieldset ${frozen||busy?'disabled':''} style="border:0;padding:0;margin:0"><div class="card"><h2>Case information</h2><label id="investment-mode-label">Investment Type</label><div class="investment-modes" role="group" aria-labelledby="investment-mode-label"><button type="button" data-action="mode" data-mode="single" aria-pressed="${single}">Single Fund</button><button type="button" data-action="mode" data-mode="multiple" aria-pressed="${!single}">Multiple Funds</button></div>${field('record_date','Transaction date','date','min="1900-01-01" max="2200-12-31" required')}${field('client_name','Client name / reference','text','maxlength="200" autocomplete="off" aria-describedby="client-reference-help" required')}<small class="muted" id="client-reference-help">Use only the client reference needed for this sale. Do not enter identity or bank details.</small><label for="transaction_type">Transaction type</label><select id="transaction_type" name="transaction_type">${options(transactions,draft.transaction_type)}</select>${single?'':field('total_investment','Total Investment (RM)','number','min="0.01" max="1000000000000" step="0.01" inputmode="decimal" required')}</div><div id="funds">${draft.items.map((i,n)=>`<section class="card fund-card"><div class="row"><h2>Fund ${n+1}</h2>${draft.items.length>1?`<button type="button" data-remove="${n}" aria-label="Remove Fund ${n+1}">Remove</button>`:''}</div><label for="fund-${n}">Product / Fund Name</label><input id="fund-${n}" data-item="${n}" data-field="product_name" value="${esc(i.product_name)}" maxlength="200" required><label for="type-${n}">Product Type</label><select id="type-${n}" data-item="${n}" data-field="product_type">${options(types,i.product_type)}</select><label for="gross-${n}">Gross Investment (RM)</label><input id="gross-${n}" type="number" data-item="${n}" data-field="gross_investment" value="${esc(i.gross_investment)}" min="0.01" max="1000000000000" step="0.01" inputmode="decimal" required><div id="rates-${n}">${rateControls(i,n)}</div></section>`).join('')}</div>${single?'':`<button type="button" class="full" data-action="add" ${draft.items.length>=100?'disabled':''}>+ Add Fund</button>`}</fieldset><div class="summary"><div id="allocation"></div><p id="validation" class="muted"></p><button id="submit" class="primary full" ${busy?'disabled':''}>${busy?'Submitting…':frozen?'Retry saved submission':draft.edit_id?'Resubmit for review':'Submit for review'}</button><p class="muted">Estimates use the Tracker formula. Administrator approval confirms the sale.</p></div></form>${frozen?'<div class="notice warning">A request was attempted. Its content is locked so retries reuse the same attempt. Check My Submissions before creating another case.</div>':''}<button class="full" data-action="discard">Discard device draft</button>`;updateSummary();}
function updateSummary(){const el=document.getElementById('allocation');if(!el)return;const t=totals(),remaining=(number(draft.total_investment)||0)-t.allocated;el.innerHTML=draft.investment_mode==='single'?`<div class="single-investment"><span>Investment</span><strong>${money(number(draft.total_investment)||0)}</strong></div><div class="estimate-grid"><div><span>Estimated Net</span><strong>${money(t.net)}</strong></div><div><span>Estimated Commission</span><strong>${money(t.commission)}</strong></div></div>`:`<div class="allocation-state ${!(number(draft.total_investment)>0)?'empty':Math.abs(remaining)<.005?'balanced':'mismatch'}"><span>Allocation summary</span><strong>${!(number(draft.total_investment)>0)?'Enter total investment':Math.abs(remaining)<.005?'Balanced':'Allocation mismatch'}</strong></div><div class="allocation-grid"><div><span>Total Investment</span><strong>${money(number(draft.total_investment)||0)}</strong></div><div><span>Allocated</span><strong>${money(t.allocated)}</strong></div><div class="remaining"><span>Remaining</span><strong>${money(remaining)}</strong></div></div><div class="estimate-grid"><div><span>Estimated Net</span><strong>${money(t.net)}</strong></div><div><span>Estimated Commission</span><strong>${money(t.commission)}</strong></div></div>`;const err=validation();document.getElementById('validation').textContent=err||'Ready to submit for verification';document.getElementById('submit').disabled=busy||!!err||!navigator.onLine;document.getElementById('draftState').textContent=(navigator.onLine?'Saved on this device':'Offline · Saved on this device')+' · Not submitted';}
async function detail(id){try{selected=await check(sb.from('sales_submissions').select('*,sales_submission_items(*),sales_submission_reviews(action,revision,acted_at,note)').eq('id',id).eq('submitter_user_id',user.id).single());view='detail';render();}catch(e){message('Could not load this submission. Refresh My Submissions.');}}
function renderDetail(){const s=selected;root.innerHTML=header()+`${success?`<p class="success">${esc(success)}</p>`:''}<div class="row detail-title"><h1>${esc(s.client_name||'Submission')}</h1>${chip(s.status)}</div><p class="muted">${esc(agent)} · Submitted ${date(s.submitted_at)}</p>${s.status==='approved'?'<p class="success"><strong>Sale Confirmed</strong>Verified by the administrator.</p>':''}${s.review_note?`<div class="notice ${s.status==='changes_requested'?'warning review-reason':''}"><strong>${s.status==='changes_requested'?'Changes requested':'Review note'}</strong><p>${esc(s.review_note)}</p></div>`:''}${s.status==='changes_requested'?'<button class="primary full" data-action="edit">Edit &amp; Resubmit</button>':''}<div class="card"><h2>Case information</h2><p>${esc(s.record_date)} · ${esc(s.transaction_type)}</p><h2>${money(s.total_investment)}</h2><p>${s.sales_submission_items.length} fund items</p>${s.remark?`<p>${esc(s.remark)}</p>`:''}</div>${s.sales_submission_items.sort((a,b)=>a.item_order-b.item_order).map((i,n)=>`<div class="card detail-fund"><span class="muted">Fund ${n+1} · ${esc(i.product_type)}</span><h2>${esc(i.product_name)}</h2><strong>${money(i.gross_investment)}</strong><p class="muted">Sales charge ${esc(i.sales_charge)}% · PS ${esc(i.ps_rate)}%</p></div>`).join('')}${s.status==='changes_requested'?'':'<p class="muted">'+(s.status==='pending'?'Submitted cases stay read-only while awaiting review.':'This case is read-only.')+'</p>'}<h2>Review history</h2>${s.sales_submission_reviews.sort((a,b)=>a.acted_at.localeCompare(b.acted_at)).map(r=>`<div class="history"><strong>${esc({submitted:'Submitted',resubmitted:'Resubmitted',changes_requested:'Changes Requested',rejected:'Rejected',approved:'Approved',agent_link_changed:'Account activation updated'}[r.action])}</strong><small class="muted"> · ${date(r.acted_at)}</small>${r.note?`<p>${esc(r.note)}</p>`:''}</div>`).join('')}`;}
async function send(){if(busy)return;syncSingleInvestment();if(validation())return;if(!navigator.onLine){save();message('Offline. Saved on this device · Not submitted.','warning');return;}busy=true;save();try{if(!draft.attempt){const payload={p_record_date:draft.record_date,p_client_name:draft.client_name.trim(),p_transaction_type:draft.transaction_type,p_remark:draft.remark.trim(),p_total_investment:Number(draft.total_investment),p_items:draft.items.map(i=>({...i,product_name:i.product_name.trim(),gross_investment:Number(i.gross_investment),sales_charge:Number(i.sales_charge),ps_rate:Number(i.ps_rate)}))};draft.attempt=draft.edit_id?{rpc:'resubmit_sale',payload:{...payload,p_submission_id:draft.edit_id,p_expected_revision:draft.revision}}:{rpc:'submit_sale',payload:{...payload,p_client_request_id:crypto.randomUUID()}};save();}renderForm();const a=draft.attempt;let result;if(a.rpc==='resubmit_sale'){const current=await check(sb.from('sales_submissions').select('id,revision,status,record_date,client_name,transaction_type,remark,total_investment,sales_submission_items(product_name,product_type,gross_investment,sales_charge,ps_rate,item_order)').eq('id',a.payload.p_submission_id).eq('submitter_user_id',user.id).single());if(current.revision===a.payload.p_expected_revision+1&&current.record_date===a.payload.p_record_date&&current.client_name===a.payload.p_client_name&&current.transaction_type===a.payload.p_transaction_type&&current.remark===a.payload.p_remark&&Number(current.total_investment)===a.payload.p_total_investment&&current.sales_submission_items.length===a.payload.p_items.length&&current.sales_submission_items.sort((x,y)=>x.item_order-y.item_order).every((x,n)=>Object.entries(a.payload.p_items[n]).every(([k,v])=>x[k]===v||(['gross_investment','sales_charge','ps_rate'].includes(k)&&Number(x[k])===v))))result={submission_id:current.id};}if(!result)result=await check(sb.rpc(a.rpc,a.payload));localStorage.removeItem(key());draft=null;success='Submitted successfully · Check the current review status below';busy=false;view='home';await refresh();await detail(result.submission_id);}catch(e){busy=false;if(draft){renderForm();message(safeError(e));}}finally{busy=false;}}
async function logoutSales(){
 if(busy||logoutInFlight)return;
 const draftKey=user?key():null;logoutInFlight=true;busy=true;epoch++;render();
 try{
  await check(sb.auth.signOut({scope:'local'}));
  const state=await check(sb.auth.getSession());
  if(state.session||localStorage.getItem('ngc-sales-auth-v2')!==null)throw new Error('Logout not verified');
  if(draftKey)localStorage.removeItem(draftKey);
  user=null;link=null;draft=null;selected=null;success='';loginEmailSent=false;loginNotice='';loginNoticeKind='';otpVerifying=false;
 }catch{
  busy=false;logoutInFlight=false;render();message('Could not confirm sign-out. Please try again.');return;
 }finally{busy=false;logoutInFlight=false;}
 render();
}
root.addEventListener('input',e=>{if(view==='form'&&draft&&!draft.attempt){if(e.target.dataset.item!==undefined)updateItemControl(e.target);else if(e.target.name in draft)draft[e.target.name]=e.target.value;save();updateSummary();}});
root.addEventListener('change',e=>{if(view==='form'&&draft&&!draft.attempt){if(e.target.dataset.item!==undefined)updateItemControl(e.target);else if(e.target.name in draft)draft[e.target.name]=e.target.value;save();updateSummary();}});
root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.case){success='';return detail(b.dataset.case);}if(b.dataset.remove!==undefined&&!busy&&!draft.attempt){draft.items.splice(Number(b.dataset.remove),1);save();render();return;}const a=b.dataset.action;if(!a)return;if(a==='signout')return logoutSales();if(a==='mode')return switchInvestmentMode(b.dataset.mode);if(a==='refresh'){view='home';success='';await refresh();}if(a==='home'){view='home';success='';await refresh();}if(a==='new'||a==='resume'){const old=loadDraft();if(a==='new'&&old){draft=old;view='form';render();message('A device draft already exists. Resume it or discard it first.','warning');return;}draft=old||newDraft();view='form';success='';save();render();}if(a==='add'&&!busy&&!draft.attempt&&draft.investment_mode==='multiple'&&draft.items.length<100){draft.items.push(blankItem());save();render();}if(a==='discard'){if(busy)return;localStorage.removeItem(key());draft=null;view='home';render();}if(a==='edit'){draft={record_date:selected.record_date,client_name:selected.client_name,transaction_type:selected.transaction_type,remark:selected.remark,total_investment:String(selected.total_investment),items:selected.sales_submission_items.map(i=>({product_name:i.product_name,product_type:i.product_type,gross_investment:String(i.gross_investment),sales_charge:String(i.sales_charge),ps_rate:String(i.ps_rate)})),edit_id:selected.id,revision:selected.revision,reason:selected.review_note,attempt:null};restoreInvestmentMode(draft);view='form';save();render();}});
async function verifyLoginCode(){
 if(!authBootstrapped||busy||loginSending||otpVerifying)return;
 const token=document.getElementById('code').value.trim();
 if(!/^[0-9]{8}$/.test(token)){message('Enter the 8-digit code from your email.');return;}
 busy=true;otpVerifying=true;loginNotice='';render();
 try{await check(sb.auth.verifyOtp({email,token,type:'email'}));loginEmailSent=false;loginNotice='';view='home';await refresh();}
 catch{loginNotice='The code is invalid or expired. Request a new login code.';loginNoticeKind='error';}
 finally{busy=false;otpVerifying=false;render();}
}
root.addEventListener('submit',async e=>{e.preventDefault();if(e.target.id==='sale')return send();if(e.target.id==='login'){if(!authBootstrapped||busy||loginSending)return;email=document.getElementById('email').value.trim();busy=true;loginSending=true;loginEmailSent=false;loginNotice='';render();try{await check(sb.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:parent.location.origin+'/#sales'}}));loginEmailSent=true;loginNotice='Login code sent. Check your email and enter the 8-digit code below.';loginNoticeKind='';}catch(e){loginNotice=/Signups not allowed|not found/i.test(e.message)?'This email is not registered for NGC Sales. Contact the administrator.':safeError(e);loginNoticeKind='error';}finally{busy=false;loginSending=false;render();}}if(e.target.id==='otp')return verifyLoginCode();});
window.addEventListener('offline',()=>{save();if(view==='form')updateSummary();else render();});window.addEventListener('online',()=>{if(view==='form')updateSummary();else refresh();});
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){if(!authBootstrapped)return;epoch++;if(logoutInFlight)return;user=null;link=null;draft=null;selected=null;loginEmailSent=false;loginNotice='';loginNoticeKind='';otpVerifying=false;render();}});
(async()=>{try{const h=parent.location.hash;render();await check(sb.auth.initialize());const start=h.search(/#(?=(?:access_token|refresh_token|error|error_code|error_description)=)/);if(start!==-1){const p=new URLSearchParams(h.slice(start+1));if(p.has('error')||p.has('error_code')||!p.get('access_token')||!p.get('refresh_token'))throw new Error('Invalid Auth callback');await check(sb.auth.setSession({access_token:p.get('access_token'),refresh_token:p.get('refresh_token')}));parent.history.replaceState({app:'sales'},'','#sales');}await refresh();}catch(e){loginNoticeKind='error';loginNotice=/#(?:access_token|refresh_token|error|error_code|error_description)=/.test(parent.location.hash)?'The sign-in link has expired. Request another email.':safeError(e);}finally{authBootstrapped=true;busy=false;render();}})();
</script></body></html>
